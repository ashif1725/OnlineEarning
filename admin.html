<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | SkillEarn Hub</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

/* LOGIN */

.admin-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 40px rgba(0,0,0,.1);
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.brand h1{
    margin:0;
    font-size:30px;
}

.brand span{
    color:#2463eb;
}

.admin-badge{
    display:inline-block;
    margin-top:10px;
    padding:7px 14px;
    background:#edf4ff;
    color:#2463eb;
    border-radius:50px;
    font-weight:bold;
    font-size:13px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input{
    width:100%;
    padding:14px;
    border:1px solid #d8dee8;
    border-radius:10px;
    font-size:16px;
}

.admin-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2463eb;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.admin-btn:disabled{
    opacity:.6;
