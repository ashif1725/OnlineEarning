<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Dashboard — SkillEarn Hub
    </title>


    <link
        rel="stylesheet"
        href="../assets/css/app.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/dashboard.css"
    >

</head>


<body class="dashboard-page">


<div class="dashboard-shell">


    <aside class="dashboard-sidebar">

        <div class="sidebar-brand">

            <a
                href="../index.html"
                class="brand"
            >

                <span class="brand-mark">
                    S
                </span>

                <span class="brand-text">
                    SkillEarn Admin
                </span>

            </a>

        </div>


        <div class="sidebar-profile">

            <div
                class="profile-avatar"
                id="adminAvatar"
            >
                A
            </div>


            <div class="profile-info">

                <strong
                    id="adminName"
                >
                    Admin
                </strong>


                <span
                    id="adminEmail"
                >
                    —
                </span>

            </div>

        </div>


        <nav class="dashboard-nav">

            <a
                href="#overview"
                class="nav-item active"
            >
                <span>
                    Overview
                </span>
            </a>


            <a
                href="#users"
                class="nav-item"
            >
                <span>
                    Users
                </span>
            </a>


            <a
                href="#deposits"
                class="nav-item"
            >
                <span>
                    Deposits
                </span>
            </a>


            <button
                id="logoutButton"
                class="nav-item"
                type="button"
            >
                Logout
            </button>

        </nav>

    </aside>


    <main class="dashboard-main">


        <header class="dashboard-topbar">

            <h1>
                Admin Dashboard
            </h1>

        </header>


        <div class="dashboard-content">


            <section id="overview">

                <div class="page-heading">

                    <span class="section-kicker">
                        ADMINISTRATION
                    </span>


                    <h2>
                        Welcome,
                        <span id="adminWelcomeName">
                            Admin
                        </span>
                    </h2>


                    <p>
                        SkillEarn Hub administration panel.
                    </p>

                </div>


                <div class="content-card">

                    <h3>
                        Administrator Account
                    </h3>


                    <p>

                        <strong>
                            Email:
                        </strong>

                        <span id="adminProfileEmail">
                            —
                        </span>

                    </p>


                    <p>

                        <strong>
                            Role:
                        </strong>

                        <span id="adminRole">
                            —
                        </span>

                    </p>

                </div>

            </section>


            <section id="users">

                <div class="page-heading">

                    <h2>
                        Users
                    </h2>

                    <p>
                        User management data will appear here.
                    </p>

                </div>

            </section>


            <section id="deposits">

                <div class="page-heading">

                    <h2>
                        Deposits
                    </h2>

                    <p>
                        Pending deposit requests will appear here.
                    </p>

                </div>

            </section>

        </div>

    </main>

</div>


<script src="../assets/js/config.js"></script>

<script src="../assets/js/auth.js"></script>

<script src="../assets/js/admin-dashboard.js"></script>


</body>

</html>
