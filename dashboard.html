<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | SkillEarn Hub</title>

<link rel="stylesheet" href="css/style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>

<style>

.dashboard-page {
    background: #f5f7fb;
    min-height: 100vh;
}

.dashboard-header {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.dashboard-logo {
    font-size: 28px;
    font-weight: 800;
    color: #172033;
    text-decoration: none;
}

.dashboard-logo span {
    color: #2563eb;
}

.logout-btn {
    border: 1px solid #d1d5db;
    background: #fff;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.logout-btn:hover {
    background: #f3f4f6;
}

.dashboard-container {
    width: 90%;
    max-width: 1200px;
    margin: 35px auto;
}

.welcome-card {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    border-radius: 24px;
    padding: 35px;
    margin-bottom: 25px;
}

.welcome-card h1 {
    margin: 0 0 10px;
    font-size: 32px;
}

.welcome-card p {
    margin: 0;
    opacity: .9;
    font-size: 16px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    padding: 25px;
}

.stat-icon {
    width: 55px;
    height: 55px;
    border-radius: 15px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    margin-bottom: 15px;
}

.stat-title {
    color: #7b8494;
    font-size: 16px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
    color: #172033;
}

.section-card {
    background: white;
    border-radius: 24px;
    padding: 32px;
    margin-bottom: 25px;
    border: 1px solid #e5e7eb;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.section-header h2 {
    margin: 0;
    font-size: 28px;
    color: #172033;
}

.section-header a {
    color: #2563eb;
    font-weight: 700;
    text-decoration: none;
}

.courses-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.course-card {
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    overflow: hidden;
    background: #fff;
}

.course-image {
    height: 150px;
    background: #eef4ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
}

.course-content {
    padding: 22px;
}

.course-category {
    color: #2563eb;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.course-title {
    font-size: 21px;
    font-weight: 800;
    color: #172033;
    margin-bottom: 10px;
}

.course-description {
    color: #7b8494;
    line-height: 1.5;
    margin-bottom: 18px;
}

.progress-wrapper {
    margin-bottom: 18px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
    font-size: 13px;
    color: #6b7280;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #2563eb;
    border-radius: 10px;
}

.continue-btn {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
}

.empty-courses {
    text-align: center;
    padding: 55px 20px;
    border: 2px dashed #e5e7eb;
    border-radius: 18px;
}

.empty-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.empty-courses h3 {
    margin: 0 0 8px;
    color: #172033;
    font-size: 22px;
}

.empty-courses p {
    color: #7b8494;
    margin-bottom: 20px;
}

.browse-btn {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 12px 22px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #6b7280;
}

.profile-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.profile-info {
    flex: 1;
}

.profile-label {
    color: #7b8494;
    font-size: 14px;
    margin-bottom: 5px;
}

.profile-value {
    color: #172033;
    font-size: 17px;
    font-weight: 700;
}

.edit-profile {
    color: #2563eb;
    font-weight: 700;
    text-decoration: none;
}

@media (max-width: 768px) {

    .dashboard-header {
        padding: 16px 20px;
    }

    .dashboard-logo {
        font-size: 23px;
    }

    .dashboard-container {
        width: calc(100% - 30px);
        margin: 20px auto;
    }

    .welcome-card {
        padding: 25px;
        border-radius: 20px;
    }

    .welcome-card h1 {
        font-size: 26px;
    }

    .stats-grid {
        grid-template-columns: 1fr;
    }

    .courses-grid {
        grid-template-columns: 1fr;
    }

    .section-card {
        padding: 22px;
    }

    .section-header h2 {
        font-size: 23px;
    }

    .profile-row {
        flex-direction: column;
    }
}

</style>
</head>

<body class="dashboard-page">

<header class="dashboard-header">

    <a href="index.html" class="dashboard-logo">
        SkillEarn<span>Hub</span>
    </a>

    <button class="logout-btn" onclick="logoutUser()">
        Logout
    </button>

</header>


<main class="dashboard-container">

    <!-- Welcome -->
    <section class="welcome-card">

        <h1 id="welcomeTitle">
            Welcome Back 👋
        </h1>

        <p>
            Continue learning, building skills and growing your online journey.
        </p>

    </section>


    <!-- Statistics -->
    <section class="stats-grid">

        <div class="stat-card">

            <div class="stat-icon">
                📚
            </div>

            <div class="stat-title">
                Enrolled Courses
            </div>

            <div class="stat-value" id="courseCount">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📈
            </div>

            <div class="stat-title">
                Learning Progress
            </div>

            <div class="stat-value" id="learningProgress">
                0%
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <div class="stat-title">
                Available Earnings
            </div>

            <div class="stat-value" id="earnings">
                ₹0.00
            </div>

        </div>

    </section>


    <!-- My Courses -->
    <section class="section-card">

        <div class="section-header">

            <div>
                <h2>My Courses</h2>
            </div>

            <a href="courses.html">
                Browse Courses →
            </a>

        </div>


        <div id="coursesContainer">

            <div class="loading">
                Loading your courses...
            </div>

        </div>

    </section>


    <!-- Profile -->
    <section class="section-card">

        <div class="section-header">

            <h2>My Profile</h2>

            <a href="profile.html" class="edit-profile">
                Edit
            </a>

        </div>


        <div class="profile-row">

            <div class="profile-info">

                <div class="profile-label">
                    Name
                </div>

                <div class="profile-value" id="profileName">
                    Loading...
                </div>

            </div>


            <div class="profile-info">

                <div class="profile-label">
                    Email
                </div>

                <div class="profile-value" id="profileEmail">
                    Loading...
                </div>

            </div>

        </div>

    </section>


</main>


<script>

document.addEventListener("DOMContentLoaded", function () {

    firebase.auth().onAuthStateChanged(async function (user) {

        if (!user) {

            window.location.href = "login.html";
            return;

        }

        console.log("Logged in user:", user.uid);

        loadUserProfile(user);

        loadUserCourses(user);

    });

});


/* ============================
   USER PROFILE
============================ */

async function loadUserProfile(user) {

    const nameElement =
        document.getElementById("profileName");

    const emailElement =
        document.getElementById("profileEmail");

    const welcomeTitle =
        document.getElementById("welcomeTitle");

    const earningsElement =
        document.getElementById("earnings");

    nameElement.textContent =
        user.displayName || "User";

    emailElement.textContent =
        user.email || "";

    welcomeTitle.textContent =
        "Welcome Back, " +
        (user.displayName || "User") +
        " 👋";


    try {

        const db = firebase.firestore();

        const userDoc =
            await db.collection("users")
            .doc(user.uid)
            .get();


        if (userDoc.exists) {

            const data = userDoc.data();

            if (data.name) {

                nameElement.textContent =
                    data.name;

                welcomeTitle.textContent =
                    "Welcome Back, " +
                    data.name +
                    " 👋";

            }


            if (data.walletBalance !== undefined) {

                earningsElement.textContent =
                    "₹" +
                    Number(data.walletBalance || 0)
                    .toFixed(2);

            }

        }

    } catch (error) {

        console.error(
            "Profile loading error:",
            error
        );

    }

}


/* ============================
   LOAD ENROLLED COURSES
============================ */

async function loadUserCourses(user) {

    const container =
        document.getElementById(
            "coursesContainer"
        );

    const countElement =
        document.getElementById(
            "courseCount"
        );

    const progressElement =
        document.getElementById(
            "learningProgress"
        );


    try {

        const db = firebase.firestore();

        /*
         Recommended Firestore structure:

         enrollments
            └── enrollmentId
                 userId
                 courseId
                 progress
                 status
                 enrolledAt
        */

        const snapshot =
            await db.collection("enrollments")
            .where("userId", "==", user.uid)
            .get();


        if (snapshot.empty) {

            countElement.textContent = "0";

            progressElement.textContent = "0%";

            container.innerHTML = `

                <div class="empty-courses">

                    <div class="empty-icon">
                        📚
                    </div>

                    <h3>
                        No Courses Yet
                    </h3>

                    <p>
                        You haven't enrolled in any course yet.
                    </p>

                    <a
                        href="courses.html"
                        class="browse-btn"
                    >
                        Browse Courses
                    </a>

                </div>

            `;

            return;

        }


        countElement.textContent =
            snapshot.size;


        let totalProgress = 0;

        let courseHTML = "";


        for (const enrollmentDoc of snapshot.docs) {

            const enrollment =
                enrollmentDoc.data();


            let course = null;


            /*
             Get course information
            */

            if (enrollment.courseId) {

                const courseDoc =
                    await db.collection("courses")
                    .doc(enrollment.courseId)
                    .get();


                if (courseDoc.exists) {

                    course =
                        courseDoc.data();

                }

            }


            /*
             Fallback if course data
             is stored inside enrollment
            */

            if (!course) {

                course = {

                    title:
                        enrollment.courseTitle ||
                        "Course",

                    description:
                        enrollment.description ||
                        "Continue your learning journey.",

                    category:
                        enrollment.category ||
                        "Learning",

                    icon:
                        enrollment.icon ||
                        "📚"

                };

            }


            const progress =
                Number(
                    enrollment.progress || 0
                );


            totalProgress += progress;


            courseHTML += `

                <article class="course-card">

                    <div class="course-image">

                        ${
                            course.image
                            ?
                            `<img
                                src="${escapeHTML(course.image)}"
                                alt="${escapeHTML(course.title)}"
                                style="width:100%;height:100%;object-fit:cover;"
                            >`
                            :
                            (course.icon || "📚")
                        }

                    </div>


                    <div class="course-content">

                        <div class="course-category">

                            ${escapeHTML(
                                course.category ||
                                "COURSE"
                            )}

                        </div>


                        <div class="course-title">

                            ${escapeHTML(
                                course.title ||
                                "Untitled Course"
                            )}

                        </div>


                        <div class="course-description">

                            ${escapeHTML(
                                course.description ||
                                "Continue your learning journey."
                            )}

                        </div>


                        <div class="progress-wrapper">

                            <div class="progress-top">

                                <span>
                                    Progress
                                </span>

                                <strong>
                                    ${progress}%
                                </strong>

                            </div>


                            <div class="progress-bar">

                                <div
                                    class="progress-fill"
                                    style="width:${Math.min(
                                        progress,
                                        100
                                    )}%"
                                ></div>

                            </div>

                        </div>


                        <a
                            href="course-details.html?id=${encodeURIComponent(
                                enrollment.courseId || ""
                            )}"
                            class="continue-btn"
                        >
                            Continue Learning →
                        </a>

                    </div>

                </article>

            `;

        }


        const averageProgress =
            snapshot.size > 0
            ?
            Math.round(
                totalProgress /
                snapshot.size
            )
            :
            0;


        progressElement.textContent =
            averageProgress + "%";


        container.innerHTML = `

            <div class="courses-grid">

                ${courseHTML}

            </div>

        `;


    } catch (error) {

        console.error(
            "Course loading error:",
            error
        );


        container.innerHTML = `

            <div class="empty-courses">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to Load Courses
                </h3>

                <p>
                    Please check your Firebase
                    Firestore configuration and rules.
                </p>

                <button
                    class="browse-btn"
                    onclick="location.reload()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* ============================
   HTML SECURITY
============================ */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
