<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Reset your SkillEarn Hub account password.">
<meta name="theme-color" content="#070b16">

<title>Reset Password — SkillEarn Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">

</head><body class="auth-page"><div class="auth-background">
    <div class="auth-glow auth-glow-one"></div>
    <div class="auth-glow auth-glow-two"></div>
    <div class="auth-grid"></div>
</div>

<main class="auth-wrapper">

    <a href="../index.html" class="auth-brand">
        <span class="brand-mark">
            <span class="brand-mark-icon">S</span>
        </span>

        <span class="brand-text">
            <strong>SkillEarn</strong>
            <small>HUB</small>
        </span>
    </a>

    <section class="auth-card">

        <div class="auth-heading">

            <div class="auth-icon">↻</div>

            <h1>Forgot password?</h1>

            <p>
                Enter your email and we'll help you reset your password.
            </p>

        </div>

        <div class="auth-alert" id="forgotAlert" role="alert"></div>

        <form id="forgotForm" class="auth-form" novalidate>

            <div class="form-group">
                <label for="forgotEmail">Email Address</label>

                <div class="input-wrapper">
                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit">
                <span>Send Reset Link</span>
                <span>→</span>
            </button>

        </form>

        <div class="back-login">
            <a href="login.html">
                ← Back to login
            </a>
        </div>

    </section>

    <p class="auth-footer">
        © 2026 SkillEarn Hub ·
        <a href="#">Privacy</a> ·
        <a href="#">Terms</a>
    </p>

</main>

<script src="../js/auth.js"></script>

</body>
</html>
