<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         BASIC META
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to your SkillEarn Hub account."
    >

    <meta
        name="theme-color"
        content="#0b1020"
    >

    <title>Login | SkillEarn Hub</title>


    <!-- =========================================
         GOOGLE FONTS
    ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================
         MAIN CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- =========================================
         AUTH CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../css/register.css"
    >

</head>


<body>


<!-- =================================================
     LOGIN PAGE
================================================= -->

<main class="auth-page">

    <section
        class="auth-card"
        aria-labelledby="loginTitle"
    >


        <!-- =========================================
             BRAND
        ========================================== -->

        <div class="brand">

            <div
                class="brand-logo"
                aria-hidden="true"
            >
                S
            </div>


            <div class="brand-info">

                <h1>
                    SkillEarn Hub
                </h1>

                <p>
                    Learn. Earn. Grow.
                </p>

            </div>

        </div>


        <!-- =========================================
             HEADING
        ========================================== -->

        <div class="auth-heading">

            <span class="eyebrow">
                WELCOME BACK
            </span>

            <h2 id="loginTitle">
                Login to Your Account
            </h2>

            <p>
                Sign in to continue to your SkillEarn Hub account.
            </p>

        </div>


        <!-- =========================================
             LOGIN MESSAGE
        ========================================== -->

        <div
            id="loginMessage"
            class="auth-message"
            role="alert"
            aria-live="polite"
        ></div>


        <!-- =========================================
             LOGIN FORM
        ========================================== -->

        <form
            id="loginForm"
            novalidate
        >


            <!-- =====================================
                 EMAIL
            ====================================== -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    maxlength="120"
                    required
                >

            </div>


            <!-- =====================================
                 PASSWORD
            ====================================== -->

            <div class="form-group">

                <div class="form-label-row">

                    <label for="password">
                        Password
                    </label>

                    <a
                        href="#"
                        id="forgotPasswordLink"
                    >
                        Forgot Password?
                    </a>

                </div>


                <div class="password-field">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        maxlength="128"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                        aria-label="Show password"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- =====================================
                 REMEMBER
            ====================================== -->

            <label class="terms-row">

                <input
                    type="checkbox"
                    id="rememberMe"
                    name="rememberMe"
                >

                <span>
                    Remember me on this device
                </span>

            </label>


            <!-- =====================================
                 LOGIN BUTTON
            ====================================== -->

            <button
                type="submit"
                id="loginButton"
                class="primary-button"
            >

                <span id="loginButtonText">
                    Login
                </span>

                <span
                    id="loginLoader"
                    class="button-loader"
                    aria-hidden="true"
                ></span>

            </button>

        </form>


        <!-- =========================================
             REGISTER DIVIDER
        ========================================== -->

        <div class="auth-divider">

            <span>
                Don't have an account?
            </span>

        </div>


        <!-- =========================================
             REGISTER BUTTON
        ========================================== -->

        <a
            href="./register.html"
            class="secondary-button"
        >
            Create New Account
        </a>


        <!-- =========================================
             BACK HOME
        ========================================== -->

        <a
            href="../index.html"
            class="back-home"
        >
            ← Back to Home
        </a>


        <!-- =========================================
             SECURITY NOTE
        ========================================== -->

        <p class="security-note">

            Your account authentication is securely handled
            through Firebase Authentication.

        </p>

    </section>

</main>


<!-- =================================================
     FIREBASE COMPAT SDK
     IMPORTANT:
     Firebase scripts MUST load first.
================================================= -->

<script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"
></script>


<script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"
></script>


<script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"
></script>


<!-- =================================================
     FIREBASE CONFIG
================================================= -->

<script src="../js/firebase-config.js"></script>


<!-- =================================================
     LOGIN LOGIC
================================================= -->

<script src="../js/login.js"></script>


<!-- =================================================
     FORGOT PASSWORD
     Safe placeholder until password-reset logic
     is connected.
================================================= -->

<script>

    const forgotPasswordLink =
        document.getElementById("forgotPasswordLink");


    if (forgotPasswordLink) {

        forgotPasswordLink.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                const emailInput =
                    document.getElementById("email");

                const email =
                    emailInput
                        ? emailInput.value.trim()
                        : "";


                if (!email) {

                    const message =
                        document.getElementById(
                            "loginMessage"
                        );

                    if (message) {

                        message.textContent =
                            "Enter your email address first.";

                        message.className =
                            "auth-message show error";

                    }

                    if (emailInput) {
                        emailInput.focus();
                    }

                    return;
                }


                firebase
                    .auth()
                    .sendPasswordResetEmail(email)
                    .then(function () {

                        const message =
                            document.getElementById(
                                "loginMessage"
                            );

                        if (message) {

                            message.textContent =
                                "Password reset email sent. Please check your inbox.";

                            message.className =
                                "auth-message show success";

                        }

                    })
                    .catch(function (error) {

                        const message =
                            document.getElementById(
                                "loginMessage"
                            );

                        if (!message) return;


                        let text =
                            "Unable to send password reset email.";


                        if (
                            error.code ===
                            "auth/user-not-found"
                        ) {

                            text =
                                "No account was found with this email.";

                        } else if (
                            error.code ===
                            "auth/invalid-email"
                        ) {

                            text =
                                "Please enter a valid email address.";

                        } else if (
                            error.code ===
                            "auth/too-many-requests"
                        ) {

                            text =
                                "Too many requests. Please try again later.";

                        }


                        message.textContent = text;

                        message.className =
                            "auth-message show error";

                    });

            }
        );

    }

</script>


</body>
</html>
