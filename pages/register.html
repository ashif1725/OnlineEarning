<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your SkillEarn Hub account."
    >

    <title>Create Account | SkillEarn Hub</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/register.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-logo">S</div>

                <div>
                    <h1>SkillEarn Hub</h1>
                    <p>Create your account</p>
                </div>
            </div>

            <div class="auth-heading">
                <span class="eyebrow">WELCOME</span>

                <h2>Create Account</h2>

                <p>
                    Register to access your SkillEarn Hub account.
                </p>
            </div>

            <div
                id="registerMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="128"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-field">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="128"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <label class="terms-row">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#" aria-label="Terms and Conditions">
                            Terms &amp; Conditions
                        </a>
                        and
                        <a href="#" aria-label="Privacy Policy">
                            Privacy Policy
                        </a>.
                    </span>
                </label>

                <button
                    type="submit"
                    id="registerButton"
                    class="primary-button"
                >
                    <span id="registerButtonText">
                        Create Account
                    </span>

                    <span
                        id="registerLoader"
                        class="button-loader"
                        aria-hidden="true"
                    ></span>
                </button>

            </form>

            <div class="auth-divider">
                <span>Already registered?</span>
            </div>

            <a
                href="./login.html"
                class="secondary-button"
            >
                Login to Account
            </a>

            <p class="security-note">
                Your account credentials are securely handled through
                Firebase Authentication.
            </p>

        </section>

    </main>

    <script type="module" src="./js/register.js"></script>

</body>
</html>
