
<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Create your SkillEarn Hub account.">
<meta name="theme-color" content="#070b16">

<title>Create Account — SkillEarn Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">

</head><body class="auth-page"><div class="auth-background">
    <div class="auth-glow auth-glow-one"></div>
    <div class="auth-glow auth-glow-two"></div>
    <div class="auth-grid"></div>
</div>

<main class="auth-wrapper auth-wrapper-register">

    <a href="../index.html" class="auth-brand">
        <span class="brand-mark">
            <span class="brand-mark-icon">S</span>
        </span>

        <span class="brand-text">
            <strong>SkillEarn</strong>
            <small>HUB</small>
        </span>
    </a>

    <section class="auth-card">

        <div class="auth-heading">
            <div class="auth-icon">✦</div>

            <h1>Create your account</h1>

            <p>
                Start your SkillEarn Hub journey today.
            </p>
        </div>

        <div class="auth-alert" id="registerAlert" role="alert"></div>

        <form id="registerForm" class="auth-form" novalidate>

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>

                    <div class="input-wrapper">
                        <span class="input-icon">●</span>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="First name"
                            autocomplete="given-name"
                            maxlength="50"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>

                    <div class="input-wrapper">
                        <span class="input-icon">●</span>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Last name"
                            autocomplete="family-name"
                            maxlength="50"
                            required
                        >
                    </div>
                </div>

            </div>

            <div class="form-group">
                <label for="registerEmail">Email Address</label>

                <div class="input-wrapper">
                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>

                <div class="input-wrapper">
                    <span class="input-icon">●</span>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="registerPassword"
                        aria-label="Show password"
                    >
                        Show
                    </button>
                </div>

                <div class="password-strength">
                    <div class="strength-bars">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <small id="passwordStrengthText">
                        Use 8+ characters with a mix of letters and numbers.
                    </small>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="input-wrapper">
                    <span class="input-icon">●</span>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Show password"
                    >
                        Show
                    </button>
                </div>
            </div>

            <label class="terms-row">
                <input type="checkbox" id="acceptTerms" required>
                <span class="custom-checkbox"></span>

                <span>
                    I agree to the
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>
            </label>

            <button type="submit" class="btn btn-primary auth-submit">
                <span>Create Account</span>
                <span>→</span>
            </button>

        </form>

        <div class="secure-note">
            <span>✓</span>
            <p>We never store passwords in this frontend.</p>
        </div>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

    </section>

    <p class="auth-footer">
        © 2026 SkillEarn Hub ·
        <a href="#">Privacy</a> ·
        <a href="#">Terms</a>
    </p>

</main>

<script src="../js/auth.js"></script>

</body>
</html>
