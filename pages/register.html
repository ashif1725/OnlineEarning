<!DOCTYPE html>
<html lang="en">
<head>

    <!-- =========================================
         BASIC META
         ========================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your SkillEarn Hub account."
    >

    <meta
        name="theme-color"
        content="#315efb"
    >

    <title>Create Account | SkillEarn Hub</title>


    <!-- =========================================
         MAIN WEBSITE CSS
         ========================================= -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <!-- =========================================
         REGISTER PAGE CSS
         ========================================= -->

    <link
        rel="stylesheet"
        href="./css/register.css"
    >

</head>


<body>

    <!-- =========================================
         AUTH PAGE
         ========================================= -->

    <main class="auth-page">

        <section
            class="auth-card"
            aria-labelledby="registerTitle"
        >

            <!-- =====================================
                 BRAND
                 ===================================== -->

            <div class="brand">

                <div
                    class="brand-logo"
                    aria-hidden="true"
                >
                    S
                </div>

                <div class="brand-info">

                    <h1>
                        SkillEarn Hub
                    </h1>

                    <p>
                        Learn. Earn. Grow.
                    </p>

                </div>

            </div>


            <!-- =====================================
                 HEADING
                 ===================================== -->

            <div class="auth-heading">

                <span class="eyebrow">
                    GET STARTED
                </span>

                <h2 id="registerTitle">
                    Create Account
                </h2>

                <p>
                    Create your account and start using
                    SkillEarn Hub.
                </p>

            </div>


            <!-- =====================================
                 MESSAGE
                 ===================================== -->

            <div
                id="registerMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- =====================================
                 REGISTER FORM
                 ===================================== -->

            <form
                id="registerForm"
                novalidate
            >

                <!-- =================================
                     FULL NAME
                     ================================= -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="80"
                        required
                    >

                </div>


                <!-- =================================
                     EMAIL
                     ================================= -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="120"
                        required
                    >

                </div>


                <!-- =================================
                     PASSWORD
                     ================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="128"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- =================================
                     CONFIRM PASSWORD
                     ================================= -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="128"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- =================================
                     TERMS
                     ================================= -->

                <label class="terms-row">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <span>

                        I agree to the

                        <a
                            href="#"
                            onclick="return false;"
                        >
                            Terms &amp; Conditions
                        </a>

                        and

                        <a
                            href="#"
                            onclick="return false;"
                        >
                            Privacy Policy
                        </a>.

                    </span>

                </label>


                <!-- =================================
                     REGISTER BUTTON
                     ================================= -->

                <button
                    type="submit"
                    id="registerButton"
                    class="primary-button"
                >

                    <span id="registerButtonText">
                        Create Account
                    </span>

                    <span
                        id="registerLoader"
                        class="button-loader"
                        aria-hidden="true"
                    ></span>

                </button>

            </form>


            <!-- =====================================
                 LOGIN DIVIDER
                 ===================================== -->

            <div class="auth-divider">

                <span>
                    Already have an account?
                </span>

            </div>


            <!-- =====================================
                 LOGIN BUTTON
                 ===================================== -->

            <a
                href="./login.html"
                class="secondary-button"
            >
                Login to Account
            </a>


            <!-- =====================================
                 SECURITY NOTE
                 ===================================== -->

            <p class="security-note">

                Your authentication is securely handled
                through Firebase Authentication.

            </p>

        </section>

    </main>


    <!-- =========================================
         FIREBASE COMPAT SDK
         IMPORTANT:
         These MUST load before firebase-config.js
         ========================================= -->

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"
    ></script>


    <!-- =========================================
         FIREBASE CONFIG
         ========================================= -->

    <script src="./js/firebase-config.js"></script>


    <!-- =========================================
         REGISTER LOGIC
         IMPORTANT:
         NOT type="module"
         ========================================= -->

    <script src="./js/register.js"></script>


</body>
</html>
