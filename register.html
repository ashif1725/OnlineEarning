<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your SkillEarn Hub account"
    >

    <title>Create Account — SkillEarn Hub</title>

    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body class="auth-page">

<header class="auth-header">
    <a href="index.html" class="brand">
        <span class="brand-mark">S</span>
        <span>SkillEarn</span>
    </a>
</header>


<main class="auth-wrapper">

    <section class="auth-card">

        <div class="auth-heading">

            <div class="eyebrow">
                JOIN SKILLEARN HUB
            </div>

            <h1>Create your account</h1>

            <p>
                Create your secure account to access your
                wallet, marketplace and earning dashboard.
            </p>

        </div>


        <form id="registerForm" novalidate>

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    id="fullName"
                    name="fullName"
                    type="text"
                    autocomplete="name"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="80"
                    required
                >

                <small
                    class="field-error"
                    data-error-for="fullName"
                ></small>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    maxlength="160"
                    required
                >

                <small
                    class="field-error"
                    data-error-for="email"
                ></small>

            </div>


            <div class="form-group">

                <label for="phone">
                    Mobile Number
                </label>

                <input
                    id="phone"
                    name="phone"
                    type="tel"
                    autocomplete="tel"
                    placeholder="+91 XXXXX XXXXX"
                    maxlength="20"
                    required
                >

                <small
                    class="field-error"
                    data-error-for="phone"
                ></small>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Create a strong password"
                    minlength="12"
                    maxlength="128"
                    required
                >

                <small class="password-hint">
                    Use at least 12 characters with a strong
                    combination of letters, numbers and symbols.
                </small>

                <small
                    class="field-error"
                    data-error-for="password"
                ></small>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Re-enter your password"
                    minlength="12"
                    maxlength="128"
                    required
                >

                <small
                    class="field-error"
                    data-error-for="confirmPassword"
                ></small>

            </div>


            <div class="form-check">

                <input
                    id="terms"
                    name="terms"
                    type="checkbox"
                    required
                >

                <label for="terms">
                    I agree to the platform Terms and Privacy Policy.
                </label>

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-large auth-submit"
            >
                Create Account
            </button>


            <div
                id="registerMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Sign in
            </a>

        </div>

    </section>

</main>


<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
